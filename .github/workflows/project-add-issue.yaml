name: Project Add Issue

# ORG_GHA_RELEASE_TOKEN requires org project read/write.
# The issue label step uses the workflow GITHUB_TOKEN with issues: write.

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  add-to-project:
    runs-on: ${{ github.event.repository.private && fromJSON('{"group":"3sixty","labels":"self-hosted-small"}') || 'ubuntu-latest' }}

    steps:
      - uses: actions/add-to-project@v2
        with:
          project-url: https://github.com/orgs/3sixtyglobal/projects/1
          github-token: ${{ secrets.ORG_GHA_RELEASE_TOKEN }}

      - uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['needs-triage'],
            })
