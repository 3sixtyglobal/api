name: Build

on:
  workflow_dispatch:
    inputs:
      bunOnly:
        description: 'Only compile and run the Bun tests, as the release workflow runs the rest.'
        required: false
        type: boolean
        default: false
  pull_request:
    branches:
      - next
    paths-ignore:
      - '**/*.md'
      - '.github/**'
      - '.githooks/**'
      - 'LICENSE'
  push:
    branches:
      - next
    paths-ignore:
      - '**/*.md'
      - '.github/**'
      - '.githooks/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dist-all-packages:
    # No need to trigger on merging pull request 'chore: release next'
    # or 'docs: regenerate package documentation' as they have already performed a build
    if: "${{ github.event_name != 'push' || (!startsWith(github.event.head_commit.message, 'Merge pull request') && !startsWith(github.event.head_commit.message, 'chore: release next') && !startsWith(github.event.head_commit.message, 'docs: regenerate package documentation') && !startsWith(github.event.head_commit.message, 'chore: merge next into main for production release')) }}"
    runs-on: ${{ github.event.repository.private && fromJSON('{"group":"3sixty","labels":"self-hosted"}') || 'ubuntu-latest' }}

    steps:
      # Clone the repository to the runner
      - name: Checkout
        uses: actions/checkout@v6

      # Load test environment variables into the runner environment
      - name: Load Test Environment Variables
        shell: bash
        env:
          TEST_ENV_VARS: ${{ secrets.ORG_TEST_ENV_VARS }}
        run: |
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            echo "::add-mask::${line#*=}"
            printf '%s\n' "$line" >> "$GITHUB_ENV"
          done <<< "$TEST_ENV_VARS"

      # Setup Node
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Setup pnpm after node, the runners have no system node for its installer to use.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      # Install dependencies with retry to handle transient registry failures.
      - name: Install dependencies
        run: |
          for i in {1..5}; do
            pnpm install --frozen-lockfile && break || {
              if [ $i -eq 5 ]; then
                echo "pnpm install failed after 5 attempts"
                exit 1
              fi
              echo "pnpm install failed, retrying in 30 seconds (attempt $i/5)..."
              sleep 30
            }
          done

      # Setup any services required for tests here
      - name: Setup Test Environment
        uses: ./.github/workflows/setup-test-env
        with:
          test_env_vars: ${{ secrets.ORG_TEST_ENV_VARS }}

      # Run Lint and Dist
      - name: Run Lint and Dist
        if: ${{ !inputs.bunOnly }}
        run: |
          pnpm run quality
          pnpm run docs

      # Build the packages and tests only, for the Bun tests to run against
      - name: Compile
        if: ${{ inputs.bunOnly }}
        run: pnpm run compile

      # Setup Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Run the tests again on the Bun runtime
      - name: Run Tests (Bun)
        run: pnpm run test:bun

      # Always teardown the environment, necessary to cleanup self-hosted
      - name: Teardown Test Environment
        if: always()
        uses: ./.github/workflows/teardown-test-env
