name: Release Next

# GHA_RELEASE_TOKEN requires:
#   contents: read/write
#   pull-requests: read/write
#   workflows: read/write

# Orchestrates the full prerelease lifecycle in a single run.
#
# Reset next branch versions (optional):
#   Sets all packages to <customVersion>-next.0; skipped when customVersion is blank.
#
# Gate  – Merge version reset PR (optional):
#   Polls until the version reset PR is approved and merged.
#
# Prepare prerelease PR:
#   Runs release-please to create a versioned prerelease PR. Stops here.
#
# Gate  – Merge prerelease PR:
#   Polls until the release PR (autorelease: pending) is approved and merged.
#
# Publish:
#   Publishes packages to npm (next tag) and creates GitHub releases.

on:
  workflow_dispatch:
    inputs:
      customVersion:
        description: 'Reset the next branch to a specific base version, e.g. 0.1.0 → 0.1.0-next.0. Leave blank for a normal prerelease increment.'
        required: false
        type: string
        default: ''

env:
  ORG_GPG_EMAIL: ${{ secrets.ORG_GPG_EMAIL }}
  ORG_GPG_NAME: ${{ secrets.ORG_GPG_NAME }}

jobs:
  # When customVersion is provided, validates it against the current prerelease
  # manifest before any PRs are created. Checks:
  #   • X.Y.Z format with each component ≤ 999
  #   • Strictly greater than the current development base version so that
  #     <custom>-next.0 is ahead of the already-published prerelease
  #   • Major version does not jump by more than 1 from the current dev base
  validate-custom-version:
    name: 'Guard: Validate custom version'
    if: inputs.customVersion != ''
    runs-on: ${{ github.event.repository.private && fromJSON('{"group":"3sixty","labels":"self-hosted"}') || 'ubuntu-latest' }}

    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: next

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate custom version against current prerelease manifest
        run: node scripts/validate-custom-version.mjs next "${{ inputs.customVersion }}"

  # When customVersion is provided, runs versions-prepare on the next branch to
  # set all packages to <customVersion>-next.0 and updates the prerelease
  # manifest. Creates a PR on next for review before the release PR is opened.
  reset-next-versions:
    name: Reset next branch versions
    needs: [validate-custom-version]
    if: |
      always() &&
      !cancelled() &&
      inputs.customVersion != '' &&
      needs.validate-custom-version.result == 'success'
    runs-on: ${{ github.event.repository.private && fromJSON('{"group":"3sixty","labels":"self-hosted"}') || 'ubuntu-latest' }}

    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      pr_number: ${{ steps.versions-prepare.outputs.pr_number }}
      pr_url: ${{ steps.versions-prepare.outputs.pr_url }}
      has_changes: ${{ steps.versions-prepare.outputs.has_changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reset versions on next branch
        id: versions-prepare
        uses: ./.github/workflows/versions-prepare
        with:
          branch: next
          semver_type: custom
          custom_version: ${{ inputs.customVersion }}
          gpg_private_key: ${{ secrets.ORG_GPG_PRIVATE_KEY }}
          gpg_key_id: ${{ secrets.ORG_GPG_KEY_ID }}
          test_env_vars: ${{ secrets.ORG_TEST_ENV_VARS }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_token: ${{ secrets.ORG_GHA_RELEASE_TOKEN }}

      - name: Announce version reset PR
        if: ${{ steps.versions-prepare.outputs.pr_url != '' }}
        run: |
          echo "::notice title=Gate – Version Reset PR::Approve and merge to continue the next release: ${{ steps.versions-prepare.outputs.pr_url }}"

      - name: Restore workflow checkout
        if: always()
        uses: actions/checkout@v6

  # Polls until the version reset PR is merged. Skipped when no custom version
  # was requested or when the reset produced no changes.
  gate-reset-pr:
    name: 'Gate: Merge version reset PR'
    needs: reset-next-versions
    if: ${{ needs.reset-next-versions.outputs.has_changes == 'true' }}
    runs-on: ${{ github.event.repository.private && fromJSON('{"group":"3sixty","labels":"self-hosted"}') || 'ubuntu-latest' }}

    timeout-minutes: 360
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout workflow ref
        uses: actions/checkout@v6

      - name: Poll until version reset PR is merged
        uses: ./.github/workflows/wait-for-pr
        with:
          repo: ${{ github.repository }}
          pr_number: ${{ needs.reset-next-versions.outputs.pr_number }}
          pr_url: ${{ needs.reset-next-versions.outputs.pr_url }}
          waiting_message: Waiting for version reset PR #__PR_NUMBER__ to be merged...
          success_message: PR #__PR_NUMBER__ merged. Advancing to release preparation.
          closed_error_title: Gate Failed
          closed_error_message: Version reset PR #__PR_NUMBER__ (__PR_URL__) was closed without merging. Next release aborted.
          github_token: ${{ secrets.ORG_GHA_RELEASE_TOKEN }}

  # Prepare
  prepare:
    name: Prepare prerelease PR
    needs: [validate-custom-version, reset-next-versions, gate-reset-pr]
    if: |
      always() &&
      !cancelled() &&
      (needs.validate-custom-version.result == 'success' || needs.validate-custom-version.result == 'skipped') &&
      (needs.reset-next-versions.result == 'success' || needs.reset-next-versions.result == 'skipped') &&
      (needs.gate-reset-pr.result == 'success' || needs.gate-reset-pr.result == 'skipped')
    runs-on: ${{ github.event.repository.private && fromJSON('{"group":"3sixty","labels":"self-hosted"}') || 'ubuntu-latest' }}

    permissions:
      checks: read
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      pr_number: ${{ steps.release-prepare.outputs.pr_number }}
      pr_url: ${{ steps.release-prepare.outputs.pr_url }}

    steps:
      - name: Checkout workflow ref
        uses: actions/checkout@v6

      - name: Prepare release PR
        id: release-prepare
        uses: ./.github/workflows/release-prepare
        with:
          branch: next
          semver_type: prerelease
          gpg_private_key: ${{ secrets.ORG_GPG_PRIVATE_KEY }}
          gpg_key_id: ${{ secrets.ORG_GPG_KEY_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_token: ${{ secrets.ORG_GHA_RELEASE_TOKEN }}

      - name: Announce release PR
        if: ${{ steps.release-prepare.outputs.pr_url != '' }}
        run: |
          echo "::notice title=Gate – Prerelease PR::Review and merge to publish: ${{ steps.release-prepare.outputs.pr_url }}"

  # Polls until the release PR is approved and merged into next.
  gate-release-pr:
    name: 'Gate: Merge prerelease PR'
    needs: prepare
    if: always() && !cancelled() && needs.prepare.result == 'success'
    runs-on: ${{ github.event.repository.private && fromJSON('{"group":"3sixty","labels":"self-hosted"}') || 'ubuntu-latest' }}

    timeout-minutes: 360
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout workflow ref
        uses: actions/checkout@v6

      - name: Poll until release PR is merged
        uses: ./.github/workflows/wait-for-pr
        with:
          repo: ${{ github.repository }}
          pr_number: ${{ needs.prepare.outputs.pr_number }}
          pr_url: ${{ needs.prepare.outputs.pr_url }}
          waiting_message: Waiting for release PR #__PR_NUMBER__ to be approved and merged...
          success_message: Release PR #__PR_NUMBER__ merged. Proceeding to publish.
          closed_error_title: Gate Failed
          closed_error_message: PR #__PR_NUMBER__ (__PR_URL__) was closed without merging.
          github_token: ${{ secrets.ORG_GHA_RELEASE_TOKEN }}

  # Runs once the release PR is merged.
  process-workspaces:
    name: Process Workspaces
    needs: gate-release-pr
    if: always() && !cancelled() && needs.gate-release-pr.result == 'success'
    runs-on: ${{ github.event.repository.private && fromJSON('{"group":"3sixty","labels":"self-hosted"}') || 'ubuntu-latest' }}

    permissions:
      contents: read
    outputs:
      packages: ${{ steps.read-workspaces.outputs.packages }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ github.token }}
          ref: next

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Setup pnpm after node, the runners have no system node for its installer to use.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      # Install so pnpm can resolve the workspace graph. Scripts are skipped because
      # only the project list is needed here, nothing is built in this job. Retried
      # to handle transient registry failures.
      - name: Install dependencies
        run: |
          for i in {1..5}; do
            pnpm install --frozen-lockfile --ignore-scripts && break || {
              if [ $i -eq 5 ]; then
                echo "pnpm install failed after 5 attempts"
                exit 1
              fi
              echo "pnpm install failed, retrying in 30 seconds (attempt $i/5)..."
              sleep 30
            }
          done

      # pnpm walks the workspace in dependency order, so each package is listed after
      # the packages it depends on. The publish matrix runs one package at a time and
      # each installs its dependencies from the registry, so a dependency published
      # after its dependent would fail to resolve.
      - name: Resolve workspace publish order
        id: read-workspaces
        run: |
          PACKAGES=$(node --input-type=module -e 'import { loadWorkspaceDirs } from "./scripts/common.mjs"; console.log(JSON.stringify(await loadWorkspaceDirs()));')
          echo "Found packages: $PACKAGES"
          echo "packages=$PACKAGES" >> $GITHUB_OUTPUT

  # Serialised via max-parallel: 1 — concurrent publishes to the same npm tag race on the registry index.
  publish-packages:
    name: Publish Package (${{ matrix.package }})
    runs-on: ${{ github.event.repository.private && fromJSON('{"group":"3sixty","labels":"self-hosted"}') || 'ubuntu-latest' }}

    permissions:
      contents: read
      id-token: write
    needs: process-workspaces
    if: always() && !cancelled() && needs.process-workspaces.result == 'success'
    strategy:
      max-parallel: 1 # one package at a time — parallel dist builds can share global node_modules
      matrix:
        package: ${{ fromJson(needs.process-workspaces.outputs.packages) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ github.token }}
          ref: next

      - name: Load Test Environment Variables
        shell: bash
        env:
          TEST_ENV_VARS: ${{ secrets.ORG_TEST_ENV_VARS }}
        run: |
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            echo "::add-mask::${line#*=}"
            printf '%s\n' "$line" >> "$GITHUB_ENV"
          done <<< "$TEST_ENV_VARS"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Setup pnpm after node, the runners have no system node for its installer to use.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Setup Test Environment
        uses: ./.github/workflows/setup-test-env
        with:
          package: ${{ matrix.package }}
          test_env_vars: ${{ secrets.ORG_TEST_ENV_VARS }}

      - name: Remove Mono-Repo Node Modules
        run: |
          # Copy the workspace settings into the package directory so it becomes its own
          # workspace root, with the package globs commented out, then remove the workspace
          # files so pnpm installs dependencies from the registry as it would for a package
          # consumer. Leaving a workspace file at the repository root instead makes pnpm
          # treat the package as a non-member and skip the install entirely.
          sed '/^packages:/,/^$/ s/^/# /' pnpm-workspace.yaml > "${{ matrix.package }}/pnpm-workspace.yaml"
          rm -f package.json pnpm-lock.yaml pnpm-workspace.yaml

      # Retried to handle transient registry failures.
      - name: Install dependencies
        run: |
          cd ${{ matrix.package }}
          for i in {1..5}; do
            pnpm install --no-frozen-lockfile && break || {
              if [ $i -eq 5 ]; then
                echo "pnpm install failed after 5 attempts"
                exit 1
              fi
              echo "pnpm install failed, retrying in 30 seconds (attempt $i/5)..."
              sleep 30
            }
          done

      - name: Run Dist
        run: |
          cd ${{ matrix.package }}
          pnpm run dist

      - name: Cleanup package.json properties
        run: |
          cd ${{ matrix.package }}
          # The build approvals are only needed for install and dist.
          rm -f pnpm-workspace.yaml
          # Strip dev-only fields so they are absent from the published tarball.
          npm pkg delete scripts
          npm pkg delete devDependencies

      - name: Pack NPM Package
        id: pack_npm_package
        run: |
          cd ${{ matrix.package }}
          TARBALL_FILENAME=$(npm pack --json | node -e 'const input = JSON.parse(require("fs").readFileSync(0, "utf8")); console.log(input[0].filename);')
          echo "tarball_filename=${TARBALL_FILENAME}" >> $GITHUB_OUTPUT

      - name: Publish NPM Package
        id: publish_npm_package
        run: |
          cd ${{ matrix.package }}
          IS_PRIVATE=$(node -e "console.log(require('./package.json').private === true ? 'true' : 'false')")
          PACKAGE_NAME=$(node -e "console.log(require('./package.json').name)")
          PACKAGE_VERSION=$(node -e "console.log(require('./package.json').version)")

          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "package_version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT

          if [ "$IS_PRIVATE" = "true" ]; then
            echo "Package is marked as private, skipping publication"
            echo "published=false" >> $GITHUB_OUTPUT
          else
            # Authenticates with npm trusted publishing (OIDC via the job's id-token permission).
            npm publish "${{ steps.pack_npm_package.outputs.tarball_filename }}" --access public --tag next ${{ !github.event.repository.private && '--provenance' || '' }}
            echo "published=true" >> $GITHUB_OUTPUT
          fi

      - name: Wait for package to be available on npm
        if: steps.publish_npm_package.outputs.published == 'true'
        run: |
          PACKAGE_NAME='${{ steps.publish_npm_package.outputs.package_name }}'
          PACKAGE_VERSION='${{ steps.publish_npm_package.outputs.package_version }}'

          echo "Waiting for ${PACKAGE_NAME}@${PACKAGE_VERSION} to become available on npm..."

          MAX_ATTEMPTS=20
          SLEEP_SECONDS=10

          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
              echo "Package ${PACKAGE_NAME}@${PACKAGE_VERSION} is now available on npm."
              exit 0
            fi

            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "Timed out waiting for ${PACKAGE_NAME}@${PACKAGE_VERSION} to appear on npm."
              exit 0  # non-fatal: publish succeeded; registry propagation lag is acceptable
            fi

            echo "Not available yet (attempt ${attempt}/${MAX_ATTEMPTS}); retrying in ${SLEEP_SECONDS}s..."
            sleep $SLEEP_SECONDS
          done

      - name: Teardown Test Environment
        if: always()
        uses: ./.github/workflows/teardown-test-env

  # Creates GitHub releases from the prerelease manifest after all packages are on npm.
  publish-gh-releases:
    name: Publish GitHub Releases
    runs-on: ${{ github.event.repository.private && fromJSON('{"group":"3sixty","labels":"self-hosted"}') || 'ubuntu-latest' }}

    permissions:
      contents: read
    needs: [process-workspaces, publish-packages]
    if: always() && !cancelled() && needs.process-workspaces.result == 'success' && needs.publish-packages.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ github.token }}
          ref: next
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Setup pnpm after node, the runners have no system node for its installer to use.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Release Please
        run: |
          pnpm dlx release-please github-release \
            --config-file=release/release-please-config.prerelease.json \
            --manifest-file=release/release-please-manifest.prerelease.json \
            --repo-url=${{ github.repository }} \
            --target-branch=next \
            --token=${{ secrets.ORG_GHA_RELEASE_TOKEN }}

  # Triggers workspace-core to update its submodule pointer to the new next SHA.
  notify-workspace:
    name: Notify Workspace
    runs-on: ${{ github.event.repository.private && fromJSON('{"group":"3sixty","labels":"self-hosted"}') || 'ubuntu-latest' }}

    needs: [process-workspaces, publish-gh-releases]
    if: always() && !cancelled() && needs.process-workspaces.result == 'success' && needs.publish-gh-releases.result == 'success'

    steps:
      - name: Dispatch submodule change to workspace
        env:
          GH_TOKEN: ${{ secrets.ORG_GHA_RELEASE_TOKEN }}
        run: |
          gh api repos/3sixtyglobal/workspace-core/dispatches \
            --method POST \
            --input - <<EOF
          {
            "event_type": "submodule-published",
            "client_payload": {
              "submodule": "${{ github.event.repository.name }}",
              "branch": "next",
              "sha": "${{ github.sha }}"
            }
          }
          EOF
