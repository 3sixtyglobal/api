name: Release Production

# GHA_RELEASE_TOKEN requires:
#   actions:       read/write
#   contents:      read
#   pull-requests: read

# This workflow orchestrates the full production release process in a single run.
# It drives the Versions Prepare → Release → Publish chain and pauses at each
# review boundary until the generated pull request is approved and merged.
#
# Flow:
#   Merge next into main (optional):
#     Creates a signed merge branch and opens a PR from next into main.
#   Gate  – Merge next into main PR (optional):
#     Polls until the PR is approved and merged.
#   Prepare and build main branch:
#     Runs versions-prepare on main and opens the alignment PR.
#   Gate  – Merge main alignment PR:
#     Polls until the alignment PR is approved and merged.
#   Prepare release PR:
#     Runs release-prepare on main and opens the production release PR.
#   Gate  – Merge release PR:
#     Polls until the release PR is merged. Publishing and next-branch
#     realignment then proceed automatically.
#
# Event-driven note: The gate jobs poll the GitHub API every 60 seconds for up
# to 6 hours each. For repositories where holding a runner for that duration is
# unacceptable, replace each gate job with a lightweight repository_dispatch
# handler fired from a pull_request.closed event workflow.

on:
  workflow_dispatch:
    inputs:
      semverBump:
        description: 'Version bump type for this production release (ignored when customVersion is set)'
        required: true
        type: choice
        options:
          - '⬆️ promote next'
          - '🔧 patch'
          - '✨ minor'
          - '🚀 major'
      customVersion:
        description: 'Explicit version to release, e.g. 1.2.3. When set, overrides semverBump.'
        required: false
        type: string
        default: ''
      hotfixBranch:
        description: 'Hotfix release: name of a hotfix branch (cut from main with cherry-picked fixes) to merge into main INSTEAD of next. Realignment of next is version-only and the branch is deleted afterwards. Leave blank for a normal full release from next.'
        required: false
        type: string
        default: ''

  pull_request:
    types: [closed]
    branches:
      - main

# Only one production release may run at a time. A second trigger is queued,
# not cancelled, so it cannot race with an in-progress release.
concurrency:
  group: production-release
  cancel-in-progress: false

env:
  ORG_GPG_EMAIL: ${{ secrets.ORG_GPG_EMAIL }}
  ORG_GPG_NAME: ${{ secrets.ORG_GPG_NAME }}

jobs:
  # When customVersion is provided, validates it against the current production
  # and prerelease manifests before any PRs are created. Checks:
  #   • X.Y.Z format with each component ≤ 999
  #   • Strictly greater than the current published production version
  #   • At least equal to the current development (prerelease) version stripped
  #   • Major version does not jump by more than 1 from current prod
  validate-custom-version:
    name: 'Guard: Validate custom version'
    if: github.event_name == 'workflow_dispatch' && inputs.customVersion != ''
    runs-on: ${{ github.event.repository.private && fromJSON('{"group":"3sixty","labels":"self-hosted"}') || 'ubuntu-latest' }}

    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate custom version against current manifests
        run: node scripts/validate-custom-version.mjs prod "${{ inputs.customVersion }}"

  # Creates a branch from main and applies the exact diff of main → next as a
  # single signed commit. Using diff|apply rather than a merge algorithm
  # guarantees next's full content is present (no merge conflicts, no missing
  # files) and avoids pushing unsigned developer commits from next (which would
  # fail a "Commits must have verified signatures" push ruleset). A human merges
  # the PR; GitHub creates and signs the merge commit on main. Skipped when the
  # branches are already in sync.
  merge-next-to-main:
    name: Merge next into main
    needs: [validate-custom-version]
    # In hotfix mode (hotfixBranch set) SOURCE_BRANCH re-points every step of
    # this job at the hotfix branch instead of next: main receives ONLY the
    # cherry-picked hotfix content, never next's in-flight work.
    if: |
      github.event_name == 'workflow_dispatch' &&
      always() &&
      !cancelled() &&
      (needs.validate-custom-version.result == 'success' || needs.validate-custom-version.result == 'skipped')
    env:
      SOURCE_BRANCH: ${{ inputs.hotfixBranch || 'next' }}
    runs-on: ${{ github.event.repository.private && fromJSON('{"group":"3sixty","labels":"self-hosted"}') || 'ubuntu-latest' }}

    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr_number: ${{ steps.create-pr.outputs.pr_number }}
      pr_url: ${{ steps.create-pr.outputs.pr_url }}
      has_changes: ${{ steps.check-diff.outputs.has_changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.ORG_GHA_RELEASE_TOKEN }}

      - name: Validate hotfix inputs
        if: ${{ inputs.hotfixBranch != '' }}
        run: |
          if [ "$SOURCE_BRANCH" = "next" ] || [ "$SOURCE_BRANCH" = "main" ]; then
            echo "::error::hotfixBranch must be a dedicated hotfix branch, not '$SOURCE_BRANCH'. Releasing next with the hotfix label would skip the realignment a full release requires."
            exit 1
          fi
          # semverBump is ignored when customVersion is set, so only validate it otherwise.
          if [ -z "${{ inputs.customVersion }}" ]; then
            case "${{ inputs.semverBump }}" in
              *promote*)
                echo "::error::semverBump 'promote next' cannot be used with hotfixBranch: it derives the version from next's line while releasing different content. Use patch/minor/major or customVersion instead."
                exit 1
                ;;
            esac
          fi
          echo "Hotfix inputs valid: branch=$SOURCE_BRANCH, semverBump=${{ inputs.semverBump }}, customVersion=${{ inputs.customVersion }}"

      - name: Check if source branch is ahead of main
        id: check-diff
        run: |
          git fetch --no-tags origin main "$SOURCE_BRANCH"

          # A hotfix branch that is BEHIND main is a landmine: the merge applies the
          # full content diff main -> branch, so releasing a stale branch would
          # silently revert everything main gained since the branch was cut.
          if [ "${{ inputs.hotfixBranch }}" != "" ]; then
            BEHIND=$(git log "origin/$SOURCE_BRANCH..origin/main" --oneline | wc -l | tr -d ' ')
            if [ "$BEHIND" -gt 0 ]; then
              echo "::error::$SOURCE_BRANCH is $BEHIND commit(s) BEHIND main. Releasing it would revert those main changes (the merge applies the full content diff). Recreate the hotfix branch from the current main."
              exit 1
            fi
          fi

          AHEAD=$(git log "origin/main..origin/$SOURCE_BRANCH" --oneline | wc -l)
          if [ "$AHEAD" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "$SOURCE_BRANCH is $AHEAD commit(s) ahead of main — merge branch required."
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "$SOURCE_BRANCH and main are already in sync — skipping."
          fi

      - name: Import GPG key
        if: ${{ steps.check-diff.outputs.has_changes == 'true' }}
        run: |
          echo "${{ secrets.ORG_GPG_PRIVATE_KEY }}" | base64 --decode | gpg --import
          echo "ORG_GPG_KEY_ID=${{ secrets.ORG_GPG_KEY_ID }}" >> "$GITHUB_ENV"

      - name: Configure Git
        if: ${{ steps.check-diff.outputs.has_changes == 'true' }}
        run: |
          git config --global user.email "$ORG_GPG_EMAIL"
          git config --global user.name "$ORG_GPG_NAME"
          git config --global user.signingkey "$ORG_GPG_KEY_ID"
          git config --global commit.gpgsign true

      - name: Create merge branch
        id: create-branch
        if: ${{ steps.check-diff.outputs.has_changes == 'true' }}
        run: |
          SOURCE_SLUG=$(echo "$SOURCE_BRANCH" | tr '/' '-')
          BRANCH_NAME="release/merge-$SOURCE_SLUG-to-main-$(date +%s)"
          git checkout -b "$BRANCH_NAME" origin/main

          # Apply the exact diff from main → the source branch as a single signed
          # commit. Using diff | apply bypasses the merge algorithm entirely — no
          # conflicts to resolve and no unsigned source commits in the push.
          # Correctly handles all cases: adds, modifies, deletes, and renames.
          git diff --binary origin/main "origin/$SOURCE_BRANCH" | git apply --index

          # [skip ci] stops GitHub creating the pull_request runs for this branch.
          # They are opened by GITHUB_TOKEN, so GitHub parks them as
          # action_required with no jobs and relabels them as failures when the PR
          # merges. Closing this PR starts no release job: process-workspaces
          # requires the 'autorelease: pending' label, which only the release PR
          # has. Covers both the next and hotfix source branches.
          git commit -S -m "chore: merge $SOURCE_BRANCH into main for production release [skip ci]"
          git push origin "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Create PR merge branch → main
        id: create-pr
        if: ${{ steps.create-branch.outputs.branch_name != '' }}
        run: |
          PR_URL=$(gh pr create \
            --title "chore: merge $SOURCE_BRANCH into main for production release" \
            --body "Automated merge of \`$SOURCE_BRANCH\` into \`main\`. Conflicts resolved by taking \`$SOURCE_BRANCH\` content." \
            --base main \
            --head ${{ steps.create-branch.outputs.branch_name }})
          PR_NUMBER=$(echo "$PR_URL" | grep -o '[0-9]\+$')
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "::notice title=Gate – Next to Main PR::Approve and merge to continue the production release: $PR_URL"
          echo "Created PR #$PR_NUMBER: $PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve PR
        if: ${{ steps.create-pr.outputs.pr_number != '' }}
        run: |
          gh pr review ${{ steps.create-pr.outputs.pr_number }} --approve
        env:
          GH_TOKEN: ${{ secrets.ORG_GHA_RELEASE_TOKEN }}

      - name: Cleanup GPG key
        if: always()
        run: |
          FINGERPRINT=$(gpg --list-secret-keys --with-colons "$ORG_GPG_KEY_ID" | awk -F: '/fpr:/ {print $10}' | head -1)
          if [ -n "$FINGERPRINT" ]; then
            gpg --batch --yes --delete-secret-keys "$FINGERPRINT" || true
            gpg --batch --yes --delete-keys "$FINGERPRINT" || true
          fi

  # Polls until the PR is merged. Skipped when branches are already in sync.
  gate-next-to-main:
    name: 'Gate: Merge next into main PR'
    needs: merge-next-to-main
    if: |
      always() &&
      !cancelled() &&
      needs.merge-next-to-main.result == 'success' &&
      needs.merge-next-to-main.outputs.has_changes == 'true'
    runs-on: ${{ github.event.repository.private && fromJSON('{"group":"3sixty","labels":"self-hosted"}') || 'ubuntu-latest' }}

    timeout-minutes: 360
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout workflow ref
        uses: actions/checkout@v6

      - name: Poll until next → main PR is merged
        uses: ./.github/workflows/wait-for-pr
        with:
          repo: ${{ github.repository }}
          pr_number: ${{ needs.merge-next-to-main.outputs.pr_number }}
          pr_url: ${{ needs.merge-next-to-main.outputs.pr_url }}
          waiting_message: Waiting for PR #__PR_NUMBER__ to be merged...
          success_message: PR #__PR_NUMBER__ merged. Advancing to version preparation.
          closed_error_title: Gate Failed
          closed_error_message: PR #__PR_NUMBER__ (__PR_URL__) was closed without merging. Production release aborted.
          github_token: ${{ secrets.ORG_GHA_RELEASE_TOKEN }}

  # Runs the Versions Prepare steps inline on main and creates the alignment PR.
  prepare-main:
    name: Prepare and build main branch
    needs: [validate-custom-version, merge-next-to-main, gate-next-to-main]
    if: |
      github.event_name == 'workflow_dispatch' &&
      always() &&
      !cancelled() &&
      (needs.validate-custom-version.result == 'success' || needs.validate-custom-version.result == 'skipped') &&
      (needs.merge-next-to-main.result == 'success' || needs.merge-next-to-main.result == 'skipped') &&
      (needs.gate-next-to-main.result == 'success' || needs.gate-next-to-main.result == 'skipped')
    runs-on: ${{ github.event.repository.private && fromJSON('{"group":"3sixty","labels":"self-hosted"}') || 'ubuntu-latest' }}

    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      pr_number: ${{ steps.versions-prepare.outputs.pr_number }}
      pr_url: ${{ steps.versions-prepare.outputs.pr_url }}
      has_changes: ${{ steps.versions-prepare.outputs.has_changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.ORG_GHA_RELEASE_TOKEN }}

      - name: Resolve semver type
        id: resolve-semver
        run: |
          CUSTOM="${{ inputs.customVersion }}"
          if [ -n "$CUSTOM" ]; then
            if ! echo "$CUSTOM" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::customVersion must be a valid semver string, e.g. 1.2.3 (got: $CUSTOM)"
              exit 1
            fi
            SEMVER_TYPE='custom'
          else
            INPUT="${{ inputs.semverBump }}"
            case "$INPUT" in
              *promote*) SEMVER_TYPE='promote' ;;
              *patch*) SEMVER_TYPE='patch' ;;
              *minor*) SEMVER_TYPE='minor' ;;
              *major*) SEMVER_TYPE='major' ;;
              *)
                echo "::error::Unrecognised semver bump: $INPUT"
                exit 1
                ;;
            esac
          fi
          echo "semver_type=$SEMVER_TYPE" >> $GITHUB_OUTPUT

      - name: Versions Prepare
        id: versions-prepare
        uses: ./.github/workflows/versions-prepare
        with:
          branch: main
          semver_type: ${{ steps.resolve-semver.outputs.semver_type }}
          custom_version: ${{ inputs.customVersion }}
          gpg_private_key: ${{ secrets.ORG_GPG_PRIVATE_KEY }}
          gpg_key_id: ${{ secrets.ORG_GPG_KEY_ID }}
          test_env_vars: ${{ secrets.ORG_TEST_ENV_VARS }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_token: ${{ secrets.ORG_GHA_RELEASE_TOKEN }}

      - name: Announce main alignment PR
        if: ${{ steps.versions-prepare.outputs.has_changes == 'true' && steps.versions-prepare.outputs.pr_url != '' }}
        run: |
          echo "::notice title=Gate – Main Alignment PR::Approve and merge to continue the production release: ${{ steps.versions-prepare.outputs.pr_url }}"

      # Our self-hosted runner clears the workspace after local composite
      # actions, so restore the workflow ref before the job completes.
      - name: Restore workflow checkout
        if: ${{ always() }}
        uses: actions/checkout@v6

  # Polls until the PR is merged. Fails hard if the PR is closed without merge
  # so the release does not proceed on a misaligned main branch.
  gate-main-alignment:
    name: 'Gate: Merge main alignment PR'
    needs: prepare-main
    if: |
      always() &&
      !cancelled() &&
      needs.prepare-main.result == 'success' &&
      needs.prepare-main.outputs.has_changes == 'true'
    runs-on: ${{ github.event.repository.private && fromJSON('{"group":"3sixty","labels":"self-hosted"}') || 'ubuntu-latest' }}

    timeout-minutes: 360
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout workflow ref
        uses: actions/checkout@v6

      - name: Poll until main alignment PR is merged
        uses: ./.github/workflows/wait-for-pr
        with:
          repo: ${{ github.repository }}
          pr_number: ${{ needs.prepare-main.outputs.pr_number }}
          pr_url: ${{ needs.prepare-main.outputs.pr_url }}
          waiting_message: Waiting for PR #__PR_NUMBER__ to be approved and merged...
          success_message: PR #__PR_NUMBER__ merged. Advancing to release preparation.
          closed_error_title: Gate Failed
          closed_error_message: PR #__PR_NUMBER__ (__PR_URL__) was closed without merging. Production release aborted.
          closed_follow_up: Re-run this workflow to restart.
          github_token: ${{ secrets.ORG_GHA_RELEASE_TOKEN }}

  # Maps the semver input to the target branch and semver strategy, then runs
  # the release-prepare composite directly to create the release PR. Runs
  # whether Phase produced a PR or was a no-op.
  prepare-release:
    name: Prepare release PR
    needs:
      [
        validate-custom-version,
        merge-next-to-main,
        gate-next-to-main,
        prepare-main,
        gate-main-alignment
      ]
    if: |
      github.event_name == 'workflow_dispatch' &&
      always() &&
      !cancelled() &&
      (needs.validate-custom-version.result == 'success' || needs.validate-custom-version.result == 'skipped') &&
      (needs.merge-next-to-main.result == 'success' || needs.merge-next-to-main.result == 'skipped') &&
      (needs.gate-next-to-main.result == 'success' || needs.gate-next-to-main.result == 'skipped') &&
      (needs.prepare-main.result == 'success' || needs.prepare-main.result == 'skipped') &&
      (needs.gate-main-alignment.result == 'success' || needs.gate-main-alignment.result == 'skipped')
    runs-on: ${{ github.event.repository.private && fromJSON('{"group":"3sixty","labels":"self-hosted"}') || 'ubuntu-latest' }}

    timeout-minutes: 60
    permissions:
      checks: read
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      pr_number: ${{ steps.release-prepare.outputs.pr_number }}
      pr_url: ${{ steps.release-prepare.outputs.pr_url }}

    steps:
      - name: Resolve release type
        id: resolve-release
        run: |
          CUSTOM="${{ inputs.customVersion }}"
          if [ -n "$CUSTOM" ]; then
            # Release-As in the force commit overrides versioning strategy,
            # so semver_type only needs to be a valid value here.
            BRANCH='main'; SEMVER_TYPE='patch'
          else
            INPUT="${{ inputs.semverBump }}"
            case "$INPUT" in
              *promote*) BRANCH='main'; SEMVER_TYPE='patch' ;;
              *patch*) BRANCH='main'; SEMVER_TYPE='patch' ;;
              *minor*) BRANCH='main'; SEMVER_TYPE='minor' ;;
              *major*) BRANCH='main'; SEMVER_TYPE='major' ;;
              *)
                echo "::error::Unrecognised semver bump: $INPUT"
                exit 1
                ;;
            esac
          fi

          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "semver_type=$SEMVER_TYPE" >> $GITHUB_OUTPUT
          echo "Using branch: $BRANCH"
          echo "Using semver type: $SEMVER_TYPE"

      - name: Checkout workflow ref
        uses: actions/checkout@v6

      - name: Prepare release PR
        id: release-prepare
        uses: ./.github/workflows/release-prepare
        with:
          branch: ${{ steps.resolve-release.outputs.branch }}
          semver_type: ${{ steps.resolve-release.outputs.semver_type }}
          gpg_private_key: ${{ secrets.ORG_GPG_PRIVATE_KEY }}
          gpg_key_id: ${{ secrets.ORG_GPG_KEY_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_token: ${{ secrets.ORG_GHA_RELEASE_TOKEN }}

      - name: Label release PR as hotfix
        if: ${{ inputs.hotfixBranch != '' && steps.release-prepare.outputs.pr_number != '' }}
        run: |
          # The publish phase runs in a separate pull_request-triggered run where
          # dispatch inputs do not exist; the label carries the hotfix mode across.
          # REST endpoint, not `gh pr edit`: the latter needs read:org scope on the token.
          gh api "repos/${{ github.repository }}/issues/${{ steps.release-prepare.outputs.pr_number }}/labels" -f "labels[]=hotfix"
        env:
          GH_TOKEN: ${{ secrets.ORG_GHA_RELEASE_TOKEN }}

      - name: Announce release PR
        if: ${{ steps.release-prepare.outputs.pr_url != '' }}
        run: |
          echo "::notice title=Gate – Release PR::Review and merge to publish: ${{ steps.release-prepare.outputs.pr_url }}"

  # Polls until the release PR (labelled autorelease: pending) is merged.
  # Once merged, the Release workflow's publish phase fires automatically
  # and the next branch is realigned after publishing completes.
  gate-release-pr:
    name: 'Gate: Merge release PR'
    needs: prepare-release
    if: |
      always() &&
      !cancelled() &&
      needs.prepare-release.result == 'success' &&
      needs.prepare-release.outputs.pr_number != ''
    runs-on: ${{ github.event.repository.private && fromJSON('{"group":"3sixty","labels":"self-hosted"}') || 'ubuntu-latest' }}

    timeout-minutes: 360
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout workflow ref
        uses: actions/checkout@v6

      - name: Poll until release PR is merged
        uses: ./.github/workflows/wait-for-pr
        with:
          repo: ${{ github.repository }}
          pr_number: ${{ needs.prepare-release.outputs.pr_number }}
          pr_url: ${{ needs.prepare-release.outputs.pr_url }}
          waiting_message: |
            Waiting for release PR #__PR_NUMBER__ to be approved and merged...
            Once merged, packages will publish automatically and next will be realigned.
          success_message: |
            Release PR #__PR_NUMBER__ merged.
            The Release workflow is now publishing packages to npm and creating GitHub releases.
            The next branch will be realigned automatically after publishing completes.
          closed_error_title: Gate Failed
          closed_error_message: Release PR #__PR_NUMBER__ (__PR_URL__) was closed without merging. Publishing aborted.
          closed_follow_up: "To recover: remove the 'autorelease: pending' label from the PR, then re-run this workflow."
          github_token: ${{ secrets.ORG_GHA_RELEASE_TOKEN }}

  # Prints the final handoff state once both gates have passed.
  # Publishing and next-branch realignment are already underway via the
  # Release workflow at this point.
  summary:
    name: 'Production release handoff complete'
    needs: [merge-next-to-main, prepare-main, prepare-release, gate-release-pr]
    if: github.event_name == 'workflow_dispatch' && always() && !cancelled() && needs.gate-release-pr.result == 'success'
    runs-on: ${{ github.event.repository.private && fromJSON('{"group":"3sixty","labels":"self-hosted"}') || 'ubuntu-latest' }}

    permissions:
      actions: read

    steps:
      - name: Delete hotfix branch
        if: ${{ inputs.hotfixBranch != '' }}
        run: |
          # The release PR is merged, so main already carries the hotfix content;
          # a re-dispatch would find no diff and proceed without the branch.
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${{ inputs.hotfixBranch }}" && echo "Deleted ${{ inputs.hotfixBranch }}" || echo "::warning::Could not delete ${{ inputs.hotfixBranch }} — remove it manually."
        env:
          GH_TOKEN: ${{ secrets.ORG_GHA_RELEASE_TOKEN }}

      - name: Print release summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Wait for the publish run (triggered by the PR merge) to register
          PUBLISH_RUN_URL=""
          for i in 1 2 3 4 5 6; do
            PUBLISH_RUN_URL=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/release-production.yaml/runs?event=pull_request&per_page=5" \
              --jq "[.workflow_runs[] | select(.run_number > ${{ github.run_number }})][0].html_url // empty")
            [ -n "$PUBLISH_RUN_URL" ] && break
            sleep 5
          done
          PUBLISH_RUN_URL="${PUBLISH_RUN_URL:-https://github.com/${{ github.repository }}/actions/workflows/release-production.yaml}"

          echo "## Production Release Orchestration Complete"
          echo ""
          if [ "${{ needs.merge-next-to-main.outputs.has_changes }}" = "true" ]; then
            echo "Next → main PR:     ${{ needs.merge-next-to-main.outputs.pr_url }}"
          else
            echo "Next → main PR:     skipped (branches already in sync)"
          fi
          if [ "${{ needs.prepare-main.outputs.has_changes }}" = "true" ]; then
            echo "Main alignment PR:  ${{ needs.prepare-main.outputs.pr_url }}"
          else
            echo "Main alignment PR:  skipped (no version changes)"
          fi
          echo "Release PR:         ${{ needs.prepare-release.outputs.pr_url }}"
          echo ""
          echo "The Release workflow is now:"
          echo "  • Publishing packages to npm (latest tag)"
          echo "  • Creating GitHub releases"
          echo "  • Realigning the next branch (auto-merge enabled; merges when checks pass)"
          echo ""
          echo "Publish run: $PUBLISH_RUN_URL"
          echo "::notice title=Publish Run::$PUBLISH_RUN_URL"

          {
            echo "## Production Release Orchestration Complete"
            echo ""
            if [ "${{ needs.merge-next-to-main.outputs.has_changes }}" = "true" ]; then
              echo "- **Next → main PR:** ${{ needs.merge-next-to-main.outputs.pr_url }}"
            else
              echo "- **Next → main PR:** skipped (branches already in sync)"
            fi
            if [ "${{ needs.prepare-main.outputs.has_changes }}" = "true" ]; then
              echo "- **Main alignment PR:** ${{ needs.prepare-main.outputs.pr_url }}"
            else
              echo "- **Main alignment PR:** skipped (no version changes)"
            fi
            echo "- **Release PR:** ${{ needs.prepare-release.outputs.pr_url }}"
            echo ""
            echo "The publish workflow is now running — packages are being published to npm, GitHub releases are being created, and the next branch is being realigned."
            echo ""
            echo ":rocket: **[View publish run]($PUBLISH_RUN_URL)**"
          } >> "$GITHUB_STEP_SUMMARY"

  # Triggered automatically when the release PR (autorelease: pending) merges
  # into main. Publishes packages to npm and creates GitHub releases.
  process-workspaces:
    name: Process Workspaces
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
    runs-on: ${{ github.event.repository.private && fromJSON('{"group":"3sixty","labels":"self-hosted"}') || 'ubuntu-latest' }}

    permissions:
      contents: read
    outputs:
      packages: ${{ steps.read-workspaces.outputs.packages }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ github.token }}
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Setup pnpm after node, the runners have no system node for its installer to use.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      # Install so pnpm can resolve the workspace graph. Scripts are skipped because
      # only the project list is needed here, nothing is built in this job. Retried
      # to handle transient registry failures.
      - name: Install dependencies
        run: |
          for i in {1..5}; do
            pnpm install --frozen-lockfile --ignore-scripts && break || {
              if [ $i -eq 5 ]; then
                echo "pnpm install failed after 5 attempts"
                exit 1
              fi
              echo "pnpm install failed, retrying in 30 seconds (attempt $i/5)..."
              sleep 30
            }
          done

      # pnpm walks the workspace in dependency order, so each package is listed after
      # the packages it depends on. The publish matrix runs one package at a time and
      # each installs its dependencies from the registry, so a dependency published
      # after its dependent would fail to resolve.
      - name: Resolve workspace publish order
        id: read-workspaces
        run: |
          PACKAGES=$(node --input-type=module -e 'import { loadWorkspaceDirs } from "./scripts/common.mjs"; console.log(JSON.stringify(await loadWorkspaceDirs()));')
          echo "Found packages: $PACKAGES"
          echo "packages=$PACKAGES" >> $GITHUB_OUTPUT

  # Only runs on the pull_request path; 'later phase only' is the fallback name shown on workflow_dispatch where this job is skipped.
  publish-packages:
    name: Publish Package (${{ matrix.package || 'later phase only' }})
    runs-on: ${{ github.event.repository.private && fromJSON('{"group":"3sixty","labels":"self-hosted"}') || 'ubuntu-latest' }}

    permissions:
      contents: read
      id-token: write
    needs: process-workspaces
    strategy:
      max-parallel: 1 # one package at a time — parallel dist builds can share global node_modules
      matrix:
        package: ${{ fromJson(needs.process-workspaces.outputs.packages) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ github.token }}
          ref: main

      - name: Load Test Environment Variables
        shell: bash
        env:
          TEST_ENV_VARS: ${{ secrets.ORG_TEST_ENV_VARS }}
        run: |
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            echo "::add-mask::${line#*=}"
            printf '%s\n' "$line" >> "$GITHUB_ENV"
          done <<< "$TEST_ENV_VARS"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Setup pnpm after node, the runners have no system node for its installer to use.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Setup Test Environment
        uses: ./.github/workflows/setup-test-env
        with:
          package: ${{ matrix.package }}
          test_env_vars: ${{ secrets.ORG_TEST_ENV_VARS }}

      - name: Remove Mono-Repo Node Modules
        run: |
          # Copy the workspace settings into the package directory so it becomes its own
          # workspace root, with the package globs commented out, then remove the workspace
          # files so pnpm installs dependencies from the registry as it would for a package
          # consumer. Leaving a workspace file at the repository root instead makes pnpm
          # treat the package as a non-member and skip the install entirely.
          sed '/^packages:/,/^$/ s/^/# /' pnpm-workspace.yaml > "${{ matrix.package }}/pnpm-workspace.yaml"
          rm -f package.json pnpm-lock.yaml pnpm-workspace.yaml

      # Retried to handle transient registry failures.
      - name: Install dependencies
        run: |
          cd ${{ matrix.package }}
          for i in {1..5}; do
            pnpm install --no-frozen-lockfile && break || {
              if [ $i -eq 5 ]; then
                echo "pnpm install failed after 5 attempts"
                exit 1
              fi
              echo "pnpm install failed, retrying in 30 seconds (attempt $i/5)..."
              sleep 30
            }
          done

      - name: Run Dist
        run: |
          cd ${{ matrix.package }}
          pnpm run dist

      - name: Cleanup package.json properties
        run: |
          cd ${{ matrix.package }}
          # The build approvals are only needed for install and dist.
          rm -f pnpm-workspace.yaml
          # Strip dev-only fields so they are absent from the published tarball.
          npm pkg delete scripts
          npm pkg delete devDependencies

      - name: Pack NPM Package
        id: pack_npm_package
        run: |
          cd ${{ matrix.package }}
          TARBALL_FILENAME=$(npm pack --json | node -e 'const input = JSON.parse(require("fs").readFileSync(0, "utf8")); console.log(input[0].filename);')
          echo "tarball_filename=${TARBALL_FILENAME}" >> $GITHUB_OUTPUT

      - name: Publish NPM Package
        id: publish_npm_package
        run: |
          cd ${{ matrix.package }}
          IS_PRIVATE=$(node -e "console.log(require('./package.json').private === true ? 'true' : 'false')")
          PACKAGE_NAME=$(node -e "console.log(require('./package.json').name)")
          PACKAGE_VERSION=$(node -e "console.log(require('./package.json').version)")

          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "package_version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT

          if [ "$IS_PRIVATE" = "true" ]; then
            echo "Package is marked as private, skipping publication"
            echo "published=false" >> $GITHUB_OUTPUT
          else
            # Authenticates with npm trusted publishing (OIDC via the job's id-token permission).
            npm publish "${{ steps.pack_npm_package.outputs.tarball_filename }}" --access public --tag latest ${{ !github.event.repository.private && '--provenance' || '' }}
            echo "published=true" >> $GITHUB_OUTPUT
          fi

      - name: Wait for package to be available on npm
        if: steps.publish_npm_package.outputs.published == 'true'
        run: |
          PACKAGE_NAME='${{ steps.publish_npm_package.outputs.package_name }}'
          PACKAGE_VERSION='${{ steps.publish_npm_package.outputs.package_version }}'

          echo "Waiting for ${PACKAGE_NAME}@${PACKAGE_VERSION} to become available on npm..."

          MAX_ATTEMPTS=20
          SLEEP_SECONDS=10

          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
              echo "Package ${PACKAGE_NAME}@${PACKAGE_VERSION} is now available on npm."
              exit 0
            fi

            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "Timed out waiting for ${PACKAGE_NAME}@${PACKAGE_VERSION} to appear on npm."
              exit 0  # non-fatal: publish succeeded; registry propagation lag is acceptable
            fi

            echo "Not available yet (attempt ${attempt}/${MAX_ATTEMPTS}); retrying in ${SLEEP_SECONDS}s..."
            sleep $SLEEP_SECONDS
          done

      - name: Teardown Test Environment
        if: always()
        uses: ./.github/workflows/teardown-test-env

  # Creates GitHub releases from the production manifest after all packages are on npm.
  publish-gh-releases:
    name: Publish GitHub Releases
    runs-on: ${{ github.event.repository.private && fromJSON('{"group":"3sixty","labels":"self-hosted"}') || 'ubuntu-latest' }}

    permissions:
      contents: read
    needs: [process-workspaces, publish-packages]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ github.token }}
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Setup pnpm after node, the runners have no system node for its installer to use.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Release Please
        run: |
          pnpm dlx release-please github-release \
            --config-file=release/release-please-config.prod.json \
            --manifest-file=release/release-please-manifest.prod.json \
            --repo-url=${{ github.repository }} \
            --target-branch=main \
            --token=${{ secrets.ORG_GHA_RELEASE_TOKEN }}

  # Triggers workspace-core to update its submodule pointer to the new main SHA.
  notify-workspace:
    name: Notify Workspace
    runs-on: ${{ github.event.repository.private && fromJSON('{"group":"3sixty","labels":"self-hosted"}') || 'ubuntu-latest' }}

    needs: [process-workspaces, publish-gh-releases]

    steps:
      - name: Dispatch submodule change to workspace
        env:
          GH_TOKEN: ${{ secrets.ORG_GHA_RELEASE_TOKEN }}
        run: |
          gh api repos/3sixtyglobal/workspace-core/dispatches \
            --method POST \
            --input - <<EOF
          {
            "event_type": "submodule-published",
            "client_payload": {
              "submodule": "${{ github.event.repository.name }}",
              "branch": "main",
              "sha": "${{ github.sha }}"
            }
          }
          EOF

  # Trigger next-branch realignment after production publish so development
  # can resume from the released version. When the release PR carries the
  # "hotfix" label the composite runs in hotfix mode: version-only realignment
  # (no content align, which would reset next to main's content and erase
  # in-flight development).
  realign-next:
    name: Realign Next Branch
    runs-on: ${{ github.event.repository.private && fromJSON('{"group":"3sixty","labels":"self-hosted"}') || 'ubuntu-latest' }}

    needs: [process-workspaces, notify-workspace]
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      pr_number: ${{ steps.versions-prepare.outputs.pr_number }}
      pr_url: ${{ steps.versions-prepare.outputs.pr_url }}
      has_changes: ${{ steps.versions-prepare.outputs.has_changes }}

    steps:
      - name: Checkout workflow ref
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.ORG_GHA_RELEASE_TOKEN }}

      - name: Versions Prepare for next
        id: versions-prepare
        uses: ./.github/workflows/versions-prepare
        with:
          branch: next
          # semver_type intentionally omitted — composite defaults to prerelease, always correct post-release
          hotfix: ${{ contains(github.event.pull_request.labels.*.name, 'hotfix') && 'true' || 'false' }}
          gpg_private_key: ${{ secrets.ORG_GPG_PRIVATE_KEY }}
          gpg_key_id: ${{ secrets.ORG_GPG_KEY_ID }}
          test_env_vars: ${{ secrets.ORG_TEST_ENV_VARS }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_token: ${{ secrets.ORG_GHA_RELEASE_TOKEN }}

      - name: Enable auto-merge on next alignment PR
        if: ${{ steps.versions-prepare.outputs.pr_number != '' }}
        run: |
          gh pr merge ${{ steps.versions-prepare.outputs.pr_number }} --auto --squash
        env:
          GH_TOKEN: ${{ secrets.ORG_GHA_RELEASE_TOKEN }}

  # Polls until the realignment PR for the next branch is merged. The PR is
  # pre-approved and auto-merge is enabled, so it merges as soon as all
  # required status checks pass. Skipped when versions-prepare was a no-op.
  gate-realign-next:
    name: 'Gate: Merge next alignment PR'
    needs: realign-next
    if: ${{ needs.realign-next.outputs.has_changes == 'true' }}
    runs-on: ${{ github.event.repository.private && fromJSON('{"group":"3sixty","labels":"self-hosted"}') || 'ubuntu-latest' }}

    timeout-minutes: 360
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout workflow ref
        uses: actions/checkout@v6

      - name: Poll until next alignment PR is merged
        uses: ./.github/workflows/wait-for-pr
        with:
          repo: ${{ github.repository }}
          pr_number: ${{ needs.realign-next.outputs.pr_number }}
          pr_url: ${{ needs.realign-next.outputs.pr_url }}
          waiting_message: Waiting for next alignment PR #__PR_NUMBER__ to merge (auto-merge enabled)...
          success_message: Next alignment PR #__PR_NUMBER__ merged. Next branch is realigned to the released version.
          closed_error_title: Gate Failed
          closed_error_message: Next alignment PR #__PR_NUMBER__ (__PR_URL__) was closed without merging. Next branch realignment incomplete.
          closed_follow_up: Re-run the Realign Next Branch job or manually merge the next alignment PR.
          github_token: ${{ secrets.ORG_GHA_RELEASE_TOKEN }}

      - name: Workflow complete
        run: echo "::notice title=Workflow Complete::Production release finished. Packages published to npm, GitHub releases created, and next branch realigned."
