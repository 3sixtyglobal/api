name: Versions Prepare
description: Prepares package versions, builds, and creates an alignment PR for the target branch.

inputs:
  branch:
    description: 'Target branch to prepare versions on (main or next)'
    required: true
  semver_type:
    description: 'Semver bump type for production releases (promote, patch, minor, major, custom). Required when branch is main.'
    required: false
    default: ''
  custom_version:
    description: 'Explicit version string, e.g. 1.2.3. Required when semver_type is custom.'
    required: false
    default: ''
  hotfix:
    description: 'Hotfix mode for branch=next: skip the content alignment (which would reset next to main and erase in-flight development) and instead sync the prod manifest from main so the version computation continues from the released hotfix version.'
    required: false
    default: 'false'
  gpg_private_key:
    description: 'Base64-encoded GPG private key for signing commits'
    required: true
  gpg_key_id:
    description: 'GPG key ID'
    required: true
  test_env_vars:
    description: 'Test environment variables'
    required: false
    default: ''
  github_token:
    description: 'GitHub token for creating PRs (github-actions bot)'
    required: true
  release_token:
    description: 'GitHub token for approving PRs (must be from a different user)'
    required: true

outputs:
  pr_number:
    description: 'Number of the created alignment PR'
    value: ${{ steps.create-pr.outputs.pr_number }}
  pr_url:
    description: 'URL of the created alignment PR'
    value: ${{ steps.create-pr.outputs.pr_url }}
  has_changes:
    description: 'Whether the versions script produced any changes'
    value: ${{ steps.check-changes.outputs.has_changes }}

runs:
  using: composite
  steps:
    # Inject secrets as env vars so subsequent steps can reference them without re-expanding the secret.
    - name: Load Test Environment Variables
      shell: bash
      env:
        TEST_ENV_VARS: ${{ inputs.test_env_vars }}
      run: |
        while IFS= read -r line; do
          [[ -z "$line" ]] && continue
          echo "::add-mask::${line#*=}"
          printf '%s\n' "$line" >> "$GITHUB_ENV"
        done <<< "$TEST_ENV_VARS"

    # Import GPG key for signing commits
    - name: Import GPG key
      shell: bash
      run: |
        echo "${{ inputs.gpg_private_key }}" | base64 --decode | gpg --import
        echo "ORG_GPG_KEY_ID=${{ inputs.gpg_key_id }}" >> $GITHUB_ENV

    # Set git config once for all subsequent steps
    - name: Configure Git
      shell: bash
      run: |
        git config --global user.email "$ORG_GPG_EMAIL"
        git config --global user.name "$ORG_GPG_NAME"
        git config --global user.signingkey "$ORG_GPG_KEY_ID"
        git config --global commit.gpgsign true
        git config --global tag.gpgsign true

    # Keep the main workspace on the triggering ref and do target-branch work in
    # a separate worktree so local actions continue to resolve from the ref that
    # started the workflow.
    - name: Prepare target worktree
      shell: bash
      run: |
        TARGET_BRANCH="${{ inputs.branch }}"
        TARGET_DIR="$RUNNER_TEMP/versions-prepare-$TARGET_BRANCH-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          git fetch --no-tags --prune --unshallow origin
        fi

        git fetch --no-tags --prune origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"

        if [ "$TARGET_BRANCH" = "next" ]; then
          git fetch --no-tags --prune origin "+refs/heads/main:refs/remotes/origin/main"
        fi

        git worktree add --detach "$TARGET_DIR" "origin/$TARGET_BRANCH"
        echo "TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"

    # Align next to main's current content before version preparation so the
    # follow-up PR does not inherit merge conflicts from divergent branch state.
    # Using diff | apply bypasses the merge algorithm entirely, so add/add
    # conflicts and other merge-time ambiguities do not block realignment.
    # Skipped for custom version resets — those only change version numbers and
    # should not pull in main content changes. Also skipped in hotfix mode:
    # main holds only the released hotfix content, so aligning would reset next
    # and erase in-flight development.
    - name: Align Next to Main
      if: ${{ inputs.branch == 'next' && inputs.semver_type != 'custom' && inputs.hotfix != 'true' }}
      shell: bash
      run: |
        cd "$TARGET_DIR"
        git diff --binary origin/next origin/main | git apply --index

    # Set up Node.js environment for running the package manager commands
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24

    # Setup pnpm after node, the runners have no system node for its installer to use.
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        cache: true

    # Hotfix mode: instead of the content alignment, sync only the release
    # artifacts from main: the prod manifest (so the version script continues
    # next's line from the released hotfix version) and the changelogs (they
    # only exist on main, and the next full release takes next's content
    # wholesale, so without this the hotfix entries would later be erased from
    # main). Records next's current version for the downgrade guard.
    - name: Sync Prod Manifest And Changelogs For Hotfix
      if: ${{ inputs.branch == 'next' && inputs.hotfix == 'true' }}
      shell: bash
      run: |
        cd "$TARGET_DIR"
        ORIGINAL_NEXT_VERSION=$(node -e "const m=require('./release/release-please-manifest.prerelease.json');console.log(Object.values(m)[0])")
        echo "ORIGINAL_NEXT_VERSION=$ORIGINAL_NEXT_VERSION" >> "$GITHUB_ENV"
        git show origin/main:release/release-please-manifest.prod.json > release/release-please-manifest.prod.json
        git ls-tree -r --name-only origin/main | grep '/docs/changelog\.md$' | while IFS= read -r CHANGELOG; do
          git checkout origin/main -- "$CHANGELOG"
          echo "Synced changelog: $CHANGELOG"
        done
        echo "Synced prod manifest from main: $(node -e "const m=require('./release/release-please-manifest.prod.json');console.log(Object.values(m)[0])") (next currently $ORIGINAL_NEXT_VERSION)"

    # Timestamp the branch name to avoid collisions when the action is re-run on the same day.
    - name: Create Version Update Branch
      shell: bash
      run: |
        BRANCH_NAME="release/versions-prepare-${{ inputs.branch }}-$(date +%s)"
        cd "$TARGET_DIR"
        git checkout -b $BRANCH_NAME
        echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

    # The version script asks pnpm for the workspace project list, which needs the
    # dependencies in place. Scripts are skipped because nothing is built here, and
    # it is retried to handle transient registry failures. After Align Next to Main
    # the target may still be an npm workspace, and there the script reads the
    # workspaces field instead, so there is nothing to install.
    - name: Install dependencies for the workspace graph
      shell: bash
      run: |
        cd "$TARGET_DIR"
        if [ ! -f pnpm-workspace.yaml ]; then
          echo "Not a pnpm workspace, the version script reads the workspaces field instead"
          exit 0
        fi
        for i in {1..5}; do
          pnpm install --frozen-lockfile --ignore-scripts && break || {
            if [ $i -eq 5 ]; then
              echo "pnpm install failed after 5 attempts"
              exit 1
            fi
            echo "pnpm install failed, retrying in 30 seconds (attempt $i/5)..."
            sleep 30
          }
        done

    # Run the custom script to align package versions for the target release type.
    # Use the script from GITHUB_WORKSPACE (the triggering branch) rather than
    # TARGET_DIR — after Align Next to Main, TARGET_DIR holds main's copy of the
    # script which may predate custom-version support on the next branch.
    - name: Update Versions
      shell: bash
      run: |
        cd "$TARGET_DIR"
        VERSIONS_SCRIPT="$GITHUB_WORKSPACE/scripts/versions-prepare.mjs"
        if [ "${{ inputs.branch }}" = "next" ] && [ "${{ inputs.semver_type }}" = "custom" ]; then
          node "$VERSIONS_SCRIPT" next custom "${{ inputs.custom_version }}"
        elif [ "${{ inputs.branch }}" = "next" ]; then
          node "$VERSIONS_SCRIPT" next
        elif [ "${{ inputs.semver_type }}" = "custom" ]; then
          node "$VERSIONS_SCRIPT" production custom "${{ inputs.custom_version }}"
        else
          node "$VERSIONS_SCRIPT" production ${{ inputs.semver_type }}
        fi

    - name: Extract version
      shell: bash
      run: |
        cd "$TARGET_DIR"
        if [ "${{ inputs.branch }}" = "next" ]; then
          MANIFEST="release/release-please-manifest.prerelease.json"
        else
          MANIFEST="release/release-please-manifest.prod.json"
        fi
        VERSION=$(node -e "const m=JSON.parse(require('fs').readFileSync('$MANIFEST','utf8'));console.log(Object.values(m)[0])")
        echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

    # release-please treats the manifest version as the last release and looks up its tag.
    # The version just written has no tag yet, so without an anchor the changelog would
    # list the whole history. Point last-release-sha at the newest release tag of this
    # line, it is committed with the versions so release-please reads it from the branch.
    - name: Set last release SHA
      shell: bash
      run: |
        cd "$TARGET_DIR"
        if [ "${{ inputs.branch }}" = "next" ]; then
          CONFIG="release/release-please-config.prerelease.json"
          PATTERN='^.+-v[0-9]+\.[0-9]+\.[0-9]+-next\.[0-9]+$'
        else
          CONFIG="release/release-please-config.prod.json"
          PATTERN='^.+-v[0-9]+\.[0-9]+\.[0-9]+$'
        fi

        git fetch --no-tags --force origin "+refs/tags/*:refs/tags/*"

        LAST_RELEASE_SHA=""
        LAST_RELEASE_TAG=""
        while IFS=$'\t' read -r SHA REFS; do
          for TAG in $(printf '%s\n' "$REFS" | grep -o 'tag: [^,]*' | sed 's/^tag: //'); do
            if [[ "$TAG" =~ $PATTERN ]]; then
              LAST_RELEASE_SHA="$SHA"
              LAST_RELEASE_TAG="$TAG"
              break 2
            fi
          done
        done < <(git log "origin/${{ inputs.branch }}" --format='%H%x09%D' --decorate-refs='refs/tags/')

        if [ -z "$LAST_RELEASE_SHA" ]; then
          echo "::warning::No release tag found on ${{ inputs.branch }}, last-release-sha in $CONFIG is unchanged."
          exit 0
        fi

        node -e "
          const fs = require('fs');
          const [file, sha] = process.argv.slice(1);
          const config = JSON.parse(fs.readFileSync(file, 'utf8'));
          config['last-release-sha'] = sha;
          fs.writeFileSync(file, JSON.stringify(config, undefined, '\t') + '\n');
        " "$CONFIG" "$LAST_RELEASE_SHA"
        echo "Set last-release-sha in $CONFIG to $LAST_RELEASE_SHA ($LAST_RELEASE_TAG)"

    # Backstop for hotfix mode: never move next's version line downwards. A
    # hotfix released with a version below next's current line (possible with a
    # customVersion validated against stale data) must fail here rather than
    # downgrade next.
    - name: Guard against next version downgrade
      if: ${{ inputs.branch == 'next' && inputs.hotfix == 'true' }}
      shell: bash
      run: |
        HIGHEST=$(printf '%s\n%s\n' "$ORIGINAL_NEXT_VERSION" "$RELEASE_VERSION" | sort -V | tail -1)
        if [ "$HIGHEST" != "$RELEASE_VERSION" ] || [ "$RELEASE_VERSION" = "$ORIGINAL_NEXT_VERSION" ]; then
          echo "::error::Computed next version $RELEASE_VERSION does not advance the current next line $ORIGINAL_NEXT_VERSION. The released hotfix version is below next's line; next was NOT modified."
          exit 1
        fi
        echo "Next line advances: $ORIGINAL_NEXT_VERSION -> $RELEASE_VERSION"

    - name: Check for changes
      id: check-changes
      shell: bash
      run: |
        cd "$TARGET_DIR"
        if [ -z "$(git status --porcelain)" ]; then
          echo "has_changes=false" >> $GITHUB_OUTPUT
          echo "No version changes detected. Skipping build and PR creation."
        else
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "Version changes detected. Proceeding with build and PR creation."
        fi

    # Uses a non-frozen install because package.json versions have just been
    # updated and the lockfile needs to be regenerated to match. Retried to handle
    # transient registry failures.
    - name: Install dependencies
      if: ${{ steps.check-changes.outputs.has_changes == 'true' }}
      shell: bash
      run: |
        cd "$TARGET_DIR"
        for i in {1..5}; do
          pnpm install --no-frozen-lockfile && break || {
            if [ $i -eq 5 ]; then
              echo "pnpm install failed after 5 attempts"
              exit 1
            fi
            echo "pnpm install failed, retrying in 30 seconds (attempt $i/5)..."
            sleep 30
          }
        done

    # Validate that the version changes do not break the build; tests are skipped
    # as we are only changing version numbers.
    - name: Build Packages
      if: ${{ steps.check-changes.outputs.has_changes == 'true' }}
      shell: bash
      run: |
        cd "$TARGET_DIR"
        pnpm run quality:no-test

    # Commit all version and lockfile changes together so the PR is self-contained.
    - name: Commit Changes
      if: ${{ steps.check-changes.outputs.has_changes == 'true' }}
      shell: bash
      run: |
        cd "$TARGET_DIR"
        git add -A
        # [skip ci] stops GitHub creating the pull_request runs for this branch.
        # They are opened by GITHUB_TOKEN, so GitHub parks them as action_required
        # with no jobs and relabels them as failures when the PR merges. Closing
        # this PR starts no release job: process-workspaces in Release Production
        # requires the 'autorelease: pending' label, which only the release PR has.
        git commit -S -m "chore: prepare versions for ${{ inputs.branch }} to $RELEASE_VERSION [skip ci]"
        git push origin $BRANCH_NAME

    # Create a PR with the changes
    - name: Create Update PR
      id: create-pr
      if: ${{ steps.check-changes.outputs.has_changes == 'true' }}
      shell: bash
      run: |
        PR_URL=$(gh pr create \
          --title "chore: prepare versions for ${{ inputs.branch }} to $RELEASE_VERSION" \
          --body "This PR prepares the versions of all packages for ${{ inputs.branch }} to \`$RELEASE_VERSION\`." \
          --base ${{ inputs.branch }} \
          --head $BRANCH_NAME)
        PR_NUMBER=$(echo $PR_URL | grep -o '[0-9]\+$')
        echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
        echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
        echo "Alignment PR created: #$PR_NUMBER – $PR_URL"
      env:
        GH_TOKEN: ${{ inputs.github_token }}

    # Approval uses a separate token because authors cannot self-approve their own PRs.
    - name: Approve PR
      if: ${{ steps.create-pr.outputs.pr_number != '' }}
      shell: bash
      run: |
        gh pr review ${{ steps.create-pr.outputs.pr_number }} --approve
      env:
        GH_TOKEN: ${{ inputs.release_token }}

    # Always remove GPG key material from the runner to prevent key leakage between jobs.
    - name: Cleanup GPG key
      if: always()
      shell: bash
      run: |
        FINGERPRINT=$(gpg --list-secret-keys --with-colons "$ORG_GPG_KEY_ID" | awk -F: '/fpr:/ {print $10}' | head -1)
        if [ -n "$FINGERPRINT" ]; then
          gpg --batch --yes --delete-secret-keys "$FINGERPRINT" || true
          gpg --batch --yes --delete-keys "$FINGERPRINT" || true
        fi

    - name: Cleanup target worktree
      if: always()
      shell: bash
      run: |
        if [ -n "${TARGET_DIR:-}" ]; then
          git worktree remove --force "$TARGET_DIR" || true
        fi
