name: Docs Update
description: Regenerates package documentation and creates a signed, auto-merged PR if docs changed.

inputs:
  branch:
    description: 'Target branch to update docs on'
    required: true
  gpg_private_key:
    description: 'Base64-encoded GPG private key for signing commits'
    required: true
  gpg_key_id:
    description: 'GPG key ID'
    required: true
  github_token:
    description: 'GitHub token for checkout and PR creation (github-actions bot)'
    required: true
  release_token:
    description: 'GitHub token for approving and merging PRs (must be from a different user)'
    required: true

outputs:
  docs_changed:
    description: 'Whether documentation changes were detected'
    value: ${{ steps.report-docs.outputs.docs_changed }}
  pr_number:
    description: 'Number of the created docs update PR (empty if no changes)'
    value: ${{ steps.create-pr.outputs.pr_number }}

runs:
  using: composite
  steps:
    # Keep the main workspace on the triggering ref and do target-branch work in
    # a separate worktree so local actions continue to resolve from the ref that
    # started the workflow.
    - name: Prepare target worktree
      shell: bash
      run: |
        TARGET_BRANCH="${{ inputs.branch }}"
        TARGET_DIR="$RUNNER_TEMP/docs-update-$TARGET_BRANCH-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

        git fetch --no-tags --prune origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
        git worktree add --detach "$TARGET_DIR" "origin/$TARGET_BRANCH"
        echo "TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"

    # Use the same Node runtime as other CI workflows in this repo.
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24

    # Setup pnpm after node, the runners have no system node for its installer to use.
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        cache: true

    # Import GPG key for signed commits.
    - name: Import GPG key
      shell: bash
      run: |
        echo "${{ inputs.gpg_private_key }}" | base64 --decode | gpg --import
        echo "ORG_GPG_KEY_ID=${{ inputs.gpg_key_id }}" >> $GITHUB_ENV

    # Configure git identity and enforce signed commits.
    - name: Configure Git
      shell: bash
      run: |
        git config --global user.email "$ORG_GPG_EMAIL"
        git config --global user.name "$ORG_GPG_NAME"
        git config --global user.signingkey "$ORG_GPG_KEY_ID"
        git config --global commit.gpgsign true
        git config --global tag.gpgsign true

    # Install dependencies once at repo root for workspace docs generation, with
    # retry to handle transient registry failures.
    - name: Install dependencies
      shell: bash
      run: |
        cd "$TARGET_DIR"
        for i in {1..5}; do
          pnpm install --frozen-lockfile && break || {
            if [ $i -eq 5 ]; then
              echo "pnpm install failed after 5 attempts"
              exit 1
            fi
            echo "pnpm install failed, retrying in 30 seconds (attempt $i/5)..."
            sleep 30
          }
        done

    # Build before generating docs because the docs script depends on compiled output.
    - name: Generate package docs
      shell: bash
      run: |
        cd "$TARGET_DIR"
        pnpm run build
        pnpm run docs

    # Diff only docs folders so unrelated working-tree changes don't influence the check.
    - name: Report docs change status
      id: report-docs
      shell: bash
      run: |
        cd "$TARGET_DIR"
        if git diff --quiet -- ':(glob)**/docs/**'; then
          echo "No documentation changes were generated."
          echo "docs_changed=false" >> $GITHUB_OUTPUT
          exit 0
        fi

        echo "Documentation changes detected in docs folders."
        git status --short -- ':(glob)**/docs/**'
        git diff --name-only -- ':(glob)**/docs/**'
        echo "docs_changed=true" >> $GITHUB_OUTPUT

    # Stage docs folders only so no non-doc changes are committed.
    - name: Commit and push docs update
      if: ${{ steps.report-docs.outputs.docs_changed == 'true' }}
      shell: bash
      run: |
        BRANCH_NAME="chore/docs-update-$(date +%s)"
        cd "$TARGET_DIR"
        git checkout -b "$BRANCH_NAME"
        echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

        git add -- ':(glob)**/docs/**'
        # [skip ci] stops GitHub creating the pull_request runs for this branch at
        # all. They are opened by GITHUB_TOKEN, so GitHub parks them as
        # action_required with no jobs and then relabels them as failures when the
        # PR merges. Nothing is lost: lint, build and docs already ran above.
        git commit -S -m "docs: regenerate package documentation [skip ci]" --signoff
        git push origin "$BRANCH_NAME"

    # Open PR back to the target branch so the docs commit goes through normal review gates.
    - name: Create docs update PR
      id: create-pr
      if: ${{ steps.report-docs.outputs.docs_changed == 'true' }}
      shell: bash
      run: |
        PR_URL=$(gh pr create \
          --title "docs: regenerate package documentation" \
          --body "Automated docs update generated by the docs-update composite action." \
          --base "${{ inputs.branch }}" \
          --head "$BRANCH_NAME")

        PR_NUMBER=$(echo "$PR_URL" | grep -o '[0-9]\+$')
        echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
        echo "Docs update PR created: #$PR_NUMBER – $PR_URL"
      env:
        GH_TOKEN: ${{ inputs.github_token }}

    # Approval uses a separate token because authors cannot self-approve their own PRs.
    - name: Approve docs update PR
      if: ${{ steps.create-pr.outputs.pr_number != '' }}
      shell: bash
      run: |
        gh pr review ${{ steps.create-pr.outputs.pr_number }} --approve
      env:
        GH_TOKEN: ${{ inputs.release_token }}

    # Poll until the PR is mergeable, then merge directly.
    # Auto-merge is not used because it requires a repository-level setting.
    #
    # UNSTABLE is accepted alongside CLEAN. This PR is opened by GITHUB_TOKEN, so
    # GitHub parks the workflow runs it triggers as action_required and they never
    # execute, which leaves the PR permanently UNSTABLE rather than CLEAN. The
    # next branch has no required status checks, so a non-required check that is
    # not successful must not block the merge. Only genuinely unmergeable states
    # (BLOCKED, DIRTY, BEHIND) keep this loop waiting.
    - name: Merge docs update PR
      if: ${{ steps.create-pr.outputs.pr_number != '' }}
      shell: bash
      run: |
        PR_NUMBER="${{ steps.create-pr.outputs.pr_number }}"

        for i in {1..30}; do
          MERGE_STATE=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json mergeStateStatus --jq '.mergeStateStatus')
          echo "PR #$PR_NUMBER mergeStateStatus: $MERGE_STATE (attempt $i/30)"

          if [ "$MERGE_STATE" = "CLEAN" ] || [ "$MERGE_STATE" = "UNSTABLE" ]; then
            echo "PR is mergeable; merging now."
            gh pr merge "$PR_NUMBER" --squash
            exit 0
          fi

          if [ "$i" -eq 30 ]; then
            echo "::error::Timed out waiting for PR #$PR_NUMBER to become mergeable (last state: $MERGE_STATE)."
            exit 1
          fi

          sleep 10
        done
      env:
        GH_TOKEN: ${{ inputs.release_token }}

    # Block until the PR is merged so callers can safely checkout the branch and see the updated docs.
    - name: Wait for docs update PR merge
      if: ${{ steps.create-pr.outputs.pr_number != '' }}
      shell: bash
      run: |
        PR_NUMBER="${{ steps.create-pr.outputs.pr_number }}"

        for i in {1..60}; do
          PR_STATE=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json state --jq '.state')
          PR_MERGED_AT=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json mergedAt --jq '.mergedAt')

          if [ "$PR_MERGED_AT" != "null" ] && [ -n "$PR_MERGED_AT" ]; then
            echo "Docs update PR #$PR_NUMBER merged at $PR_MERGED_AT."
            exit 0
          fi

          if [ "$PR_STATE" = "CLOSED" ]; then
            echo "Docs update PR #$PR_NUMBER was closed without merge."
            exit 1
          fi

          echo "Docs update PR #$PR_NUMBER not merged yet (attempt $i/60), retrying in 10s..."
          sleep 10
        done

        echo "Timed out waiting for docs update PR #$PR_NUMBER to merge."
        exit 1
      env:
        GH_TOKEN: ${{ inputs.release_token }}

    # Always remove GPG key material from the runner to prevent key leakage between jobs.
    - name: Cleanup GPG key
      if: always()
      shell: bash
      run: |
        FINGERPRINT=$(gpg --list-secret-keys --with-colons "$ORG_GPG_KEY_ID" | awk -F: '/fpr:/ {print $10}' | head -1)
        if [ -n "$FINGERPRINT" ]; then
          gpg --batch --yes --delete-secret-keys "$FINGERPRINT" || true
          gpg --batch --yes --delete-keys "$FINGERPRINT" || true
        fi

    - name: Cleanup target worktree
      if: always()
      shell: bash
      run: |
        if [ -n "${TARGET_DIR:-}" ]; then
          git worktree remove --force "$TARGET_DIR" || true
        fi
